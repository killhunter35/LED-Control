<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LED Control V9 - Hume Style</title>
    
    <link rel="apple-touch-icon" href="logo.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LED Control">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --accent-orange: #ff6b00;
            --accent-glow: rgba(255, 107, 0, 0.3);
            --ios-green: #30d158;
            --text-main: #ffffff;
            --text-sec: rgba(255, 255, 255, 0.4);
            --glass-bg: rgba(20, 20, 25, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(25px);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body { background-color: #0b0b0e; color: var(--text-main); overflow: hidden; height: 100vh; width: 100vw; position: relative; }

        /* LÜKS İÇ MEKAN ARKA PLAN (Bulanıklaştırılmış Derinlik Efekti) */
        #room-bg { 
            position: absolute; 
            top: -10%; left: -10%; width: 120%; height: 120%; 
            background-image: url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=1000&auto=format&fit=crop'); 
            background-size: cover; 
            background-position: center; 
            z-index: -5; 
            filter: blur(18px) brightness(0.35); 
            transform: scale(1.05);
        }

        /* ÜST BİLGİ BARI */
        .header { position: absolute; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 25px 20px; z-index: 10; }
        .header-title h2 { font-size: 13px; font-weight: 400; color: var(--text-sec); letter-spacing: 0.5px; }
        .header-title h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.3px; color: #fff; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        
        .status-badge { font-size: 11px; padding: 6px 12px; border-radius: 20px; font-weight: 500; display: flex; align-items: center; gap: 5px; cursor: pointer; transition: all 0.3s; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); } 
        .status-badge.evde { color: var(--accent-orange); border-color: rgba(255, 107, 0, 0.3); }
        .status-badge.disarida { color: var(--text-sec); }
        .settings-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; }

        /* SWIPE MANTIĞI & SAYFALAR */
        #swipe-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 5; touch-action: pan-y; }
        #pages-wrapper { display: flex; width: 200%; height: 100%; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); transform: translateX(0%); }
        .page { width: 50%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 95px; padding-left: 55px; padding-right: 55px; }

        /* CETVELLER (RULERS) */
        .ruler-container { position: absolute; top: 45%; transform: translateY(-50%); width: 45px; height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 15; opacity: 0.4; transition: all 0.2s ease; }
        .ruler-container.left { left: 2px; } .ruler-container.right { right: 2px; }
        .ruler-container.active { opacity: 1; transform: translateY(-50%) scale(1.1); }
        .ruler-tape-wrapper { width: 10px; height: 110px; overflow: hidden; position: relative; border-radius: 4px; }
        .ruler-tape { position: absolute; top: 0; left: 0; width: 100%; height: 200%; background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.6) 0px, rgba(255,255,255,0.6) 2px, transparent 2px, transparent 12px); transform: translateY(0); }
        .ruler-container.active .ruler-tape { background: repeating-linear-gradient(to bottom, var(--accent-orange) 0px, var(--accent-orange) 2px, transparent 2px, transparent 12px); }
        .ruler-value { font-size: 11px; font-weight: 600; color: #fff; margin-top: 10px; text-shadow: 0 1px 4px #000; font-family: monospace; }

        /* HUME TARZI CAM KARTLAR */
        .preset-stack { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 15px; }
        .glass-card { background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 22px; padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .glass-card:active { transform: scale(0.97); background: rgba(255,255,255,0.06); }
        .card-left { display: flex; align-items: center; gap: 15px; }
        .card-icon { font-size: 20px; }
        .card-title { font-size: 15px; font-weight: 500; letter-spacing: 0.3px; color: #eee; }
        .card-radio { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        
        .glass-card.active { border-color: var(--accent-orange); background: rgba(255, 107, 0, 0.08); box-shadow: 0 0 25px var(--accent-glow); }
        .glass-card.active .card-title { color: #fff; font-weight: 600; }
        .glass-card.active .card-radio { border-color: var(--accent-orange); background: var(--accent-orange); }
        .glass-card.active .card-radio::after { content: '✓'; color: #000; font-weight: bold; font-size: 13px; }

        /* SAYFA 2 - YÖRÜNGE ZAMANLAYICISI & SENKRONİZASYON */
        .orbit-tracker { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 25px; background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 28px; padding: 25px 20px; margin-bottom: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .orbit-times { display: flex; justify-content: space-between; width: 100%; padding: 0 10px; }
        .orbit-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .orbit-col span { font-size: 10px; color: var(--text-sec); letter-spacing: 1.5px; text-transform: uppercase; }
        .orbit-col h2 { font-size: 20px; font-weight: 400; letter-spacing: 0.5px; color: #fff; }
        
        .orbit-circle-container { position: relative; width: 160px; height: 160px; }
        .orbit-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .orbit-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 2.5; stroke-dasharray: 4 6; }
        .orbit-progress { fill: none; stroke: var(--accent-orange); stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 10px var(--accent-orange)); transition: stroke-dasharray 1s ease; }
        .orbit-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; }
        .orbit-center h3 { font-size: 17px; font-weight: 500; color: #fff; }
        .orbit-center p { font-size: 10px; color: var(--text-sec); margin-top: 3px; text-align: center; }

        /* iOS TARZI NOKTALI SAYFALAMA */
        .pagination-wrapper { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 8px 16px; border-radius: 30px; display: flex; gap: 8px; z-index: 20; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.25); transition: all 0.3s; }
        .dot.active { background: var(--accent-orange); transform: scale(1.3); box-shadow: 0 0 8px var(--accent-orange); }

        /* AYARLAR - LOG PANELİ */
        #log-panel { position: absolute; bottom: -100%; left: 0; width: 100%; height: 60%; background: rgba(12, 12, 16, 0.92); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-top: 1px solid var(--glass-border); border-radius: 30px 30px 0 0; z-index: 100; transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1); padding: 25px; display: flex; flex-direction: column; box-shadow: 0 -20px 40px rgba(0,0,0,0.6); }
        #log-panel.open { bottom: 0; }
        .log-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px; margin-bottom: 15px; }
        .log-header h3 { font-size: 16px; font-weight: 600; color: #fff; }
        .close-btn { background: rgba(255,255,255,0.08); border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; color: #fff; }
        .log-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .log-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #ccc; background: rgba(255,255,255,0.02); padding: 12px 15px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.04); }
        .log-time { font-size: 11px; color: var(--text-sec); font-family: monospace; }
        
        /* PC SENKRONİZASYONU KARTI */
        .sync-card { background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 22px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .sync-info h4 { font-size: 14px; margin-bottom: 3px; color: #fff; font-weight: 500; }
        .sync-info p { font-size: 11px; color: var(--text-sec); }
        .switch { position: relative; display: inline-block; width: 44px; height: 25px; flex-shrink: 0; } .switch input { opacity: 0; width: 0; height: 0; } .slider-switch { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); transition: .3s cubic-bezier(0.16, 1, 0.3, 1); border-radius: 25px; } .slider-switch:before { position: absolute; content: ""; height: 19px; width: 19px; left: 2px; bottom: 2px; background-color: white; transition: .3s cubic-bezier(0.16, 1, 0.3, 1); border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.4); } input:checked + .slider-switch { background-color: var(--accent-orange); border-color: var(--accent-orange); } input:checked + .slider-switch:before { transform: translateX(19px); }
    </style>
</head>
<body>

<!-- ARKA PLAN -->
<div id="room-bg"></div>

<header class="header">
    <div class="header-title">
        <h2>Smart Home</h2>
        <h1>Yatak Odası</h1>
    </div>
    <div class="header-right">
        <div class="status-badge evde" id="evDurumBadge" onclick="evDurumuTetikle()">🏠 Evde</div>
        <div class="settings-icon" onclick="logPanelAc()">⚙️</div>
    </div>
</header>

<!-- CETVELLER -->
<div class="ruler-container left" id="fadeRuler">
    <div class="ruler-tape-wrapper">
        <div class="ruler-tape" id="fadeTape"></div>
    </div>
    <div class="ruler-value"><span id="fadeValText">3</span>s</div>
</div>
<div class="ruler-container right" id="brightRuler">
    <div class="ruler-tape-wrapper">
        <div class="ruler-tape" id="brightTape"></div>
    </div>
    <div class="ruler-value">%<span id="brightValText">0</span></div>
</div>

<div id="swipe-container">
    <div id="pages-wrapper">
        <!-- SAYFA 1: ANA KONTROL -->
        <div class="page" id="page-1">
            <div class="preset-stack">
                <div class="glass-card" id="card-yatma" onclick="modSec('yatma', 15)">
                    <div class="card-left"><span class="card-icon">🛏️</span><span class="card-title">Yatma Modu</span></div>
                    <div class="card-radio"></div>
                </div>
                <div class="glass-card" id="card-sinema" onclick="modSec('sinema', 10)">
                    <div class="card-left"><span class="card-icon">🍿</span><span class="card-title">Sinema Modu</span></div>
                    <div class="card-radio"></div>
                </div>
                <div class="glass-card" id="card-tamguc" onclick="modSec('tamguc', 100)">
                    <div class="card-left"><span class="card-icon">☀️</span><span class="card-title">Tam Güç</span></div>
                    <div class="card-radio"></div>
                </div>
            </div>
        </div>

        <!-- SAYFA 2: ZAMANLAYICI & PC SENKRONİZASYONU -->
        <div class="page" id="page-2">
            <div class="orbit-tracker">
                <div class="orbit-times">
                    <div class="orbit-col"><span>YATMA</span><h2 id="yatmaSaati">00:20</h2></div>
                    <div class="orbit-col"><span>UYANMA</span><h2 id="uyanmaSaati">09:00</h2></div>
                </div>
                <div class="orbit-circle-container">
                    <svg class="orbit-svg" viewBox="0 0 120 120">
                        <circle class="orbit-bg" cx="60" cy="60" r="50"></circle>
                        <circle class="orbit-progress" id="orbitYay" cx="60" cy="60" r="50" stroke-dasharray="0, 314.15"></circle>
                    </svg>
                    <div class="orbit-center">
                        <h3 id="uykuSuresiMetin">8s 40d</h3>
                        <p>Sistem<br>Senkronize</p>
                    </div>
                </div>
            </div>

            <!-- PC SES SENKRONİZASYONU -->
            <div class="sync-card">
                <div class="sync-info">
                    <h4>PC Ses Senkronizasyonu</h4>
                    <p>Medyadan gelen sesi ağ üzerinden dinler.</p>
                </div>
                <label class="switch">
                    <input type="checkbox" id="udpSwitch" onchange="udpTetikle(this.checked)">
                    <span class="slider-switch"></span>
                </label>
            </div>
        </div>
    </div>
</div>

<div class="pagination-wrapper">
    <div class="dot active" id="dot-1"></div>
    <div class="dot" id="dot-2"></div>
</div>

<!-- AYARLAR & LOG PANELİ -->
<div id="log-panel">
    <div class="log-header">
        <h3>Sistem Kayıtları</h3>
        <div class="close-btn" onclick="logPanelKapat()">✕</div>
    </div>
    <div class="log-list" id="logList"></div>
</div>

<script>
    // --- 1. FIREBASE BAĞLANTISI ---
    const firebaseConfig = { 
        apiKey: "AIzaSyBEhsUAqN4l-ATvLFCjLkBvTaAAXdvF8qM", 
        databaseURL: "https://led-control-79bc3-default-rtdb.europe-west1.firebasedatabase.app", 
        projectId: "led-control-79bc3" 
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    // --- 2. LOG SİSTEMİ ---
    let actionLogs = [];
    function addLog(mesaj) {
        const now = new Date();
        const saat = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        actionLogs.unshift({ msj: mesaj, zaman: saat });
        if (actionLogs.length > 5) actionLogs.pop(); 
        
        const logHtml = actionLogs.map(log => 
            `<div class="log-item"><span>${log.msj}</span><span class="log-time">${log.zaman}</span></div>`
        ).join("");
        document.getElementById('logList').innerHTML = logHtml || `<div class="log-item" style="justify-content:center; color:#888;">Kayıt bulunamadı.</div>`;
    }
    function logPanelAc() { document.getElementById('log-panel').classList.add('open'); }
    function logPanelKapat() { document.getElementById('log-panel').classList.remove('open'); }
    addLog("Sistem Başlatıldı");

    // --- 3. SWIPE MANTIĞI ---
    const swipeContainer = document.getElementById('swipe-container');
    const pagesWrapper = document.getElementById('pages-wrapper');
    const dot1 = document.getElementById('dot-1');
    const dot2 = document.getElementById('dot-2');
    let touchStartX = 0; let touchEndX = 0; let currentPage = 0;

    swipeContainer.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
    swipeContainer.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        if (touchEndX < touchStartX - 50) { currentPage = 1; } 
        if (touchEndX > touchStartX + 50) { currentPage = 0; } 
        
        pagesWrapper.style.transform = `translateX(-${currentPage * 50}%)`;
        if (currentPage === 0) { dot1.classList.add('active'); dot2.classList.remove('active'); } 
        else { dot2.classList.add('active'); dot1.classList.remove('active'); }
    }, {passive: true});

    // --- 4. CETVELLER ---
    let b_val = 0; 
    let f_val = 3; 

    function initRuler(rulerId, tapeId, valTextId, isBrightness) {
        const ruler = document.getElementById(rulerId);
        const tape = document.getElementById(tapeId);
        const valText = document.getElementById(valTextId);
        let startY = 0; let startVal = 0; let tapePos = 0;

        ruler.addEventListener('touchstart', e => {
            startY = e.touches[0].clientY;
            startVal = isBrightness ? b_val : f_val;
            ruler.classList.add('active');
        }, {passive: false});

        ruler.addEventListener('touchmove', e => {
            e.preventDefault(); 
            let delta = startY - e.touches[0].clientY; 
            
            tapePos -= delta * 0.8;
            if (tapePos <= -100) tapePos = 0;
            if (tapePos >= 100) tapePos = 0;
            tape.style.transform = `translateY(${tapePos}%)`; 

            let calcVal = startVal + (isBrightness ? Math.round(delta / 2.5) : Math.round(delta / 12));
            calcVal = Math.max(isBrightness ? 0 : 1, Math.min(isBrightness ? 100 : 10, calcVal)); 
            
            if (isBrightness) { b_val = calcVal; valText.innerText = b_val; } 
            else { f_val = calcVal; valText.innerText = f_val; }
            
        }, {passive: false});

        ruler.addEventListener('touchend', e => {
            ruler.classList.remove('active');
            if (isBrightness) {
                if(b_val > 0) {
                    db.ref().update({'/durum': 'ACIK', '/parlaklik': b_val, '/sonParlaklik': b_val});
                    addLog(`Parlaklık %${b_val} ayarlandı`);
                    if(document.getElementById('udpSwitch').checked) udpTetikle(false); 
                } else {
                    db.ref().update({'/durum': 'KAPALI', '/parlaklik': 0});
                    addLog("LED'ler Kapatıldı");
                }
                kartlariGuncelle();
            } else {
                db.ref('/fadeHizi').set(f_val);
                addLog(`Geçiş hızı ${f_val} sn yapıldı`);
            }
        });
    }
    initRuler('brightRuler', 'brightTape', 'brightValText', true);
    initRuler('fadeRuler', 'fadeTape', 'fadeValText', false);

    // --- 5. KART KONTROLLERİ ---
    function modSec(kartId, deger) {
        b_val = deger;
        document.getElementById('brightValText').innerText = b_val;
        db.ref().update({'/durum': 'ACIK', '/parlaklik': b_val, '/sonParlaklik': b_val});
        addLog(`${kartId.toUpperCase()} Modu aktif edildi`);
        if(document.getElementById('udpSwitch').checked) udpTetikle(false); 
        kartlariGuncelle();
    }

    function kartlariGuncelle() {
        document.querySelectorAll('.glass-card').forEach(el => el.classList.remove('active'));
        if (b_val == 15) document.getElementById('card-yatma').classList.add('active');
        if (b_val == 10) document.getElementById('card-sinema').classList.add('active');
        if (b_val == 100) document.getElementById('card-tamguc').classList.add('active');
    }

    // --- 6. YÖRÜNGE ZAMANLAYICISI ---
    function uykuOrbitGuncelle(yatma, uyanma) {
        document.getElementById('yatmaSaati').textContent = yatma; 
        document.getElementById('uyanmaSaati').textContent = uyanma;
        if (!yatma || !uyanma) return;
        let [ySaat, yDak] = yatma.toString().split(/[:.]/).map(Number);
        let [uSaat, uDak] = uyanma.toString().split(/[:.]/).map(Number);
        
        let yatmaDk = (ySaat || 0) * 60 + (yDak || 0);
        let uyanmaDk = (uSaat || 0) * 60 + (uDak || 0);
        if (uyanmaDk <= yatmaDk) uyanmaDk += 24 * 60;
        
        let toplamDk = uyanmaDk - yatmaDk;
        document.getElementById('uykuSuresiMetin').textContent = `${Math.floor(toplamDk / 60)}s ${toplamDk % 60}d`;
        document.getElementById('orbitYay').setAttribute('stroke-dasharray', `${(toplamDk / (24 * 60)) * 314.15}, 314.15`);
    }

    // --- 7. VERİ DİNLEME ---
    db.ref('/durum').on('value', snap => {
        if(snap.val() !== "ACIK") { 
            b_val = 0; document.getElementById('brightValText').innerText = 0; 
            kartlariGuncelle(); 
        }
    });

    db.ref('/parlaklik').on('value', snap => {
        let val = snap.val();
        if(val !== null && val > 0) {
            b_val = val; document.getElementById('brightValText').innerText = val;
            kartlariGuncelle();
        }
    });

    db.ref('/fadeHizi').on('value', snap => {
        if(snap.val() !== null) { f_val = snap.val(); document.getElementById('fadeValText').innerText = f_val; }
    });

    db.ref('/uykuPlani').on('value', snap => {
        const v = snap.val(); if (v && v.yatma && v.uyanma) uykuOrbitGuncelle(v.yatma, v.uyanma);
    });

    let evdeMiyim = true;
    db.ref('/otomasyonlar/evdeMi').on('value', snap => {
        evdeMiyim = snap.val() === null ? true : snap.val();
        const badge = document.getElementById('evDurumBadge');
        if (evdeMiyim) { badge.innerHTML = "🏠 Evde"; badge.className = "status-badge evde"; } 
        else { badge.innerHTML = "🌍 Dışarıda"; badge.className = "status-badge disarida"; }
    });

    function evDurumuTetikle() {
        db.ref('/otomasyonlar/evdeMi').set(!evdeMiyim);
        addLog(`Ev durumu '${!evdeMiyim ? 'Evde' : 'Dışarıda'}' yapıldı`);
    }

    function udpTetikle(durum) {
        document.getElementById('udpSwitch').checked = durum;
        if(durum) { addLog("PC Ses Senkronizasyonu Aktif"); db.ref('/otomasyonlar/udpAktif').set(true); } 
        else { addLog("PC Ses Senkronizasyonu Kapalı"); db.ref('/otomasyonlar/udpAktif').set(false); }
    }
    
    db.ref('/otomasyonlar/udpAktif').on('value', snap => {
        document.getElementById('udpSwitch').checked = snap.val() === true;
    });

</script>
</body>
</html>
